name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Testes do front (node:test, sem dependências); o Maven não roda estes.
      - name: Testes do front
        run: node --test "src/test/js/*.test.mjs"

      # Testcontainers sobe o postgres:16 pelo Docker do runner (já instalado no ubuntu-latest).
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # Só em tag de versão (v0.1.0 -> imagem 0.1.0) e só se o build passou.
  # Sem tag "latest": a VPS aponta para uma versão explícita no .env.
  imagem:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/lucasmanoel1/ouvir-frase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login no GHCR
        env:
          USUARIO: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$USUARIO" --password-stdin

      - name: Build e push da imagem
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGEM:$VERSAO" .
          docker push "$IMAGEM:$VERSAO"
