name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Testes do front (node:test, sem dependências); o Maven não roda estes.
      - name: Testes do front
        run: node --test "src/test/js/*.test.mjs"

      # Testcontainers sobe o postgres:16 pelo Docker do runner (já instalado no ubuntu-latest).
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify
