services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ouvirfrase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ouvirfrase"]
      interval: 10s
      timeout: 5s
      retries: 5