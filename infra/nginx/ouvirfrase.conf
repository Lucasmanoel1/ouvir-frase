# OuvirFrase: Nginx na frente do app (producao). Roteiro completo: docs/operacao.md.
# Vai para /etc/nginx/conf.d/ouvirfrase.conf (esse diretorio entra no contexto http, por isso
# as zonas e o log_format ficam aqui). DOMINIO e trocado pelo seu dominio com sed (secao 9 do roteiro).
# Pede os arquivos que o `certbot --nginx` cria: letsencrypt/live/DOMINIO, options-ssl-nginx.conf e ssl-dhparams.pem.
# Testado no Nginx 1.24 (o do Ubuntu 24.04): "http2 on;" so existe a partir da 1.25.1, por isso `listen 443 ssl http2`.

# Limites por IP (1 MB de zona guarda ~16 mil IPs; 10m sobra). Os numeros sao ponto de partida:
# ajuste olhando o log (secao 12 do roteiro). Atras de CGNAT varios usuarios dividem um IP, por isso as rajadas folgadas.
limit_req_zone  $binary_remote_addr zone=busca_ip:10m   rate=1r/s;
limit_req_zone  $binary_remote_addr zone=video_ip:10m   rate=5r/s;
# Teto global da busca: num ataque distribuido o limite por IP nao segura; este mantem o processo vivo.
limit_req_zone  $server_name        zone=busca_total:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conexoes_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# Tempo de resposta total (rt) e do app (urt) para o GoAccess. A frase buscada vai na URL e, portanto, no log (14 dias; privacidade.html).
log_format ouvirfrase '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# 80: so redireciona (o certbot usa este mesmo servidor para a renovacao).
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;
    return 301 https://DOMINIO$request_uri;
}

# www -> sem www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://DOMINIO$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/ouvirfrase.access.log ouvirfrase;

    limit_conn conexoes_ip 10;

    # Cabecalhos: TODOS aqui, no nivel do server, com "always" (valem tambem em 404, 429 e 503).
    # Nenhum location pode ter add_header: se tiver um so, ele perde todos os de cima.
    # Referrer-Policy nunca "no-referrer" nem "same-origin": sem Referer o player do YouTube da o erro 153.
    add_header Strict-Transport-Security "max-age=300" always;  # depois de uma semana sem problema: 31536000 (secao 10 do roteiro)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # Report-Only: so registra no console. Depois da sessao completa sem violacao, troque o nome para Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com; img-src 'self' data: https://i.ytimg.com; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Erros gerados pelo proprio Nginx, em JSON no formato da API ({ erro, mensagem }); o front mostra a mensagem.
    # proxy_intercept_errors fica desligado (padrao): o 503 que o app devolve passa com o JSON dele.
    error_page 429 = @limite;
    error_page 502 503 504 = @fora;

    location @limite {
        default_type application/json;
        return 429 '{"erro":"limite","mensagem":"Muitas buscas seguidas. Espere alguns segundos e tente de novo."}';
    }

    location @fora {
        default_type application/json;
        return 503 '{"erro":"indisponivel","mensagem":"O site está ocupado. Tente de novo em instantes."}';
    }

    location = /api/busca {
        limit_req zone=busca_ip    burst=10 nodelay;
        limit_req zone=busca_total burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # A legenda inteira de um video e o ativo do produto: limite contra raspagem.
    location /api/videos/ {
        limit_req zone=video_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Do actuator, so o health (o monitor e o roteiro usam). O resto nem chega ao app.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }

    location /actuator/ {
        return 404;
    }

    # Estaticos: sem limite (o Spring comprime e manda Cache-Control: no-cache).
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
