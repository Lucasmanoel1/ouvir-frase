# Painel de ingestao (uso local). Suba com: --spring.profiles.active=ingestao,painel
# A ordem importa: "painel" depois de "ingestao" para religar o servidor web.
spring.main.web-application-type=servlet
server.address=127.0.0.1
server.port=8081
ingestao.pausa-ms=6000
# A página sai de resources/painel; o resto (css, fontes, ícones) é reaproveitado do site.
spring.web.resources.static-locations=classpath:/painel/,classpath:/static/
