# Producao: o banco chega pronto no dump e o app so le (ver docs/operacao.md).
# A senha nao tem valor padrao: se IDIOMANDO_DB_SENHA faltar, o app nao sobe e o log diz qual variavel.
spring.datasource.url=jdbc:postgresql://db:5432/idiomando
spring.datasource.username=idiomando_app
spring.datasource.password=${IDIOMANDO_DB_SENHA}

spring.flyway.enabled=false

# 1 vCPU: mais conexoes nao ajudam; sem conexao livre em 3 s a busca responde 503 em vez de enfileirar.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
