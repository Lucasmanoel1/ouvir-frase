spring.application.name=Idiomando

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/idiomando?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml

# Os modulos ES tem nome fixo: o navegador revalida (304) em vez de misturar app.js novo com util.js velho.
spring.web.resources.cache.cachecontrol.no-cache=true

spring.flyway.enabled=true

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true